{% extends "shared/base.html" %}{% block title %}{{ title }} · Job Search{% endblock %}{% block body %}
<div class="app-shell" data-shell><div class="drawer-backdrop" data-drawer-backdrop hidden></div>
<aside class="sidebar" id="primary-navigation" data-drawer aria-label="Основная навигация"><a class="brand" href="{% url 'vacancies' %}">Job Search</a><nav>
<a href="{% url 'vacancies' %}" {% if section == 'vacancies' %}aria-current="page"{% endif %}>Вакансии</a><a href="{% url 'profile' %}" {% if section == 'profile' %}aria-current="page"{% endif %}>Мой профиль</a><a href="{% url 'sources' %}" {% if section == 'sources' %}aria-current="page"{% endif %}>Источники</a></nav></aside>
<header class="topbar"><button class="icon-button" type="button" data-menu-toggle aria-label="Открыть меню" aria-expanded="false" aria-controls="primary-navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><strong>{{ title }}</strong><div class="topbar-actions"><span class="connection-status" role="status" aria-live="polite" data-connection>Онлайн</span>{% include "shared/theme_toggle.html" %}<span class="user-name">{{ request.user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button button-secondary" type="submit">Выйти</button></form></div></header>
<main class="content" id="main-content" tabindex="-1">{% block content %}{% endblock %}</main></div>{% endblock %}
